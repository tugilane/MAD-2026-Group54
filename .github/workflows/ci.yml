name: CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: android-build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Ensure Android SDK 37 is installed
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]; then
            sdkmanager "platforms;android-37.0"
          fi

      # The Gradle wrapper is checked in without the Unix executable bit.
      - name: Assemble debug APK
        run: bash ./gradlew :app:assembleDebug
